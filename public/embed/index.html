<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./embed.css" />
  <title>Secret Vault</title>
</head>
<body>
  <main id="app" class="secret-card state-loading">
    <div class="header">
      <div class="identity">
        <strong id="label">Secret</strong>
        <span id="meta">连接中…</span>
      </div>
      <span id="status" class="status">•••</span>
    </div>

    <pre id="content" class="content" hidden></pre>

    <div id="locked" class="locked" hidden>
      <span>内容已锁定</span>
      <button id="unlock" type="button">解锁</button>
    </div>

    <div id="editor" class="editor" hidden>
      <input id="edit-label" class="edit-label" type="text" autocomplete="off" placeholder="Label" />
      <textarea id="edit-content" class="edit-content" rows="5" spellcheck="false"></textarea>
      <div class="editor-actions">
        <button id="save" type="button">保存</button>
        <button id="cancel" type="button">取消</button>
      </div>
    </div>

    <div id="error" class="error" hidden></div>

    <div id="actions" class="actions">
      <button id="edit" type="button">编辑</button>
      <button id="copy" type="button">复制</button>
      <button id="lock" type="button">锁定分组</button>
    </div>
  </main>

  <script type="module" src="./embed.js"></script>
</body>
</html>
